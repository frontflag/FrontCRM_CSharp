# 生产环境 Nginx 片段：AI 长耗时接口超时（解决 504 Gateway Time-out）
# Kimi / Moonshot、客户/供应商情报调查等单次调用常需 60～180 秒；
# 仅配置 location = /api/v1/ai/invoke 不够——情报调查走独立路径，仍会走 location /api 的默认 60s。
#
# 用法：在 server { } 内、location /api 之前加入本片段，并 reload nginx：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 匹配路径：
#   POST /api/v1/ai/invoke
#   POST /api/v1/ai/invoke-business-card
#   POST /api/v1/customer-intel-reports/investigate
#   POST /api/v1/vendor-intel-reports/investigate

location ~ ^/api/v1/(ai/invoke(?:-business-card)?|customer-intel-reports/investigate|vendor-intel-reports/investigate)$ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
