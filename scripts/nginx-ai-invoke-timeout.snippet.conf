# 生产环境 Nginx 片段：AI 调用超时（解决 504 Gateway Time-out）
# Kimi / Moonshot 单次调用常需 60～120 秒，默认 proxy_read_timeout=60s 会中断请求。
#
# 用法：在 fz.semicoregroup.com 的 server { } 内、location /api 之前加入本片段，
# 并确认 proxy_pass 指向 CRM API（如 http://127.0.0.1:5000）。
#
#   sudo nano /etc/nginx/sites-available/frontcrm
#   sudo nginx -t && sudo systemctl reload nginx

location = /api/v1/ai/invoke {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
